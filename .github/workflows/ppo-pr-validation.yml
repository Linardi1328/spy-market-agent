name: PPO PR validation

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -e ".[dev]"
      - name: Node syntax checks
        shell: bash
        run: |
          while IFS= read -r -d '' file; do node --check "$file"; done < <(find . -path ./.git -prune -o -type f \( -name '*.js' -o -name '*.mjs' -o -name '*.cjs' \) -print0)
      - name: Shell syntax checks
        shell: bash
        run: |
          while IFS= read -r -d '' file; do bash -n "$file"; done < <(find . -path ./.git -prune -o -type f -name '*.sh' -print0)
      - name: Full regression suite
        run: |
          python -m ruff check .
          python -m ruff format --check .
          python -m mypy src tests
          python -m pytest
      - name: Diff whitespace checks
        run: |
          git diff --check
          git diff --check origin/main...HEAD
