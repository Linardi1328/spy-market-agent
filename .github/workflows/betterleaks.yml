name: Betterleaks

on:
  pull_request:

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: "1.25.12"
          cache: false

      - name: Install Betterleaks
        run: |
          go install github.com/betterleaks/betterleaks@5eab48332cc48565864514e3bc6de89df091a7c4
          "$(go env GOPATH)/bin/betterleaks" --version

      - name: Scan pull request commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          "$(go env GOPATH)/bin/betterleaks" git . \
            --log-opts="${BASE_SHA}..${HEAD_SHA}" \
            --redact \
            --verbose \
            --platform github
